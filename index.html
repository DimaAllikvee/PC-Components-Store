<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>PC-Components Store</title>
    <script src="/js/script.js" defer></script>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="header">
    <div class="header-inner">

        <!-- Логотип -->
        <div class="header-left">
            <div class="logo-bar"></div>
            <img src="icons/logo.svg" alt="Circuit Hub" class="logo-img">
        </div>

        <!-- Гамбургер (для мобильных) -->
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Главное меню -->
        <nav class="header-nav" id="header-nav">
            <ul class="nav-list">
                <li><a href="#" class="nav-link active">Home</a></li>
                <li><a href="product.html" class="nav-link">Products</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="#" class="nav-link">Shopping Cart</a></li>
                <li><a href="review.html" class="nav-link">Reviews</a></li>
            </ul>
        </nav>

        <!-- Иконки справа -->
        <div class="header-right">
            <button class="icon-btn" aria-label="Search" id="search-toggle">
                <img src="icons/search.svg" alt="Search">
            </button>
            <!-- Само поле поиска: скрыто по-умолчанию -->
            <input
                    type="text"
                    id="search-input"
                    placeholder="Search..."
                    aria-label="Search products"
                    class="search-input"
            />
            <button class="icon-btn" aria-label="Shopping Cart">
                <img src="icons/cart_home.svg" alt="">
            </button>
            <button class="icon-btn" aria-label="Profile">
                <img src="icons/profile.svg" alt="">
            </button>
        </div>

    </div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('search-toggle');
        const input    = document.getElementById('search-input');
        const cards    = Array.from(document.querySelectorAll('.product-card'));

        // 1) Клик по лупе: открываем/закрываем <input>
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('search-open');
            if (document.body.classList.contains('search-open')) {
                input.focus();
            } else {
                input.value = '';
                filterCards('');
            }
        });

        // 2) Поиск по вводимому тексту
        input.addEventListener('input', (e) => {
            filterCards(e.target.value);
        });

        function filterCards(query) {
            const q = query.trim().toLowerCase();
            cards.forEach(card => {
                const name = card.querySelector('.product-name').textContent.toLowerCase();
                // показываем, если совпадает, иначе — прячем
                card.style.display = name.includes(q) ? '' : 'none';
            });
        }

        // 3) Скрыть поиск, если кликнули вне поля и кнопки
        document.addEventListener('click', (e) => {
            if (!toggleBtn.contains(e.target) && !input.contains(e.target) && document.body.classList.contains('search-open')) {
                document.body.classList.remove('search-open');
                input.value = '';
                filterCards('');
            }
        });
    });
</script>


</body>
</html>
