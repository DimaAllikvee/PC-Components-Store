<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>PC-Components Store</title>
    <script src="/js/script.js" defer></script>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="header">
    <div class="header-inner">

        <!-- Логотип -->
        <div class="header-left">
            <div class="logo-bar"></div>
            <img src="icons/logo.svg" alt="Circuit Hub" class="logo-img">
        </div>

        <!-- Гамбургер (для мобильных) -->
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Главное меню -->
        <nav class="header-nav" id="header-nav">
            <ul class="nav-list">
                <li><a href="#" class="nav-link active">Home</a></li>
                <li><a href="#" class="nav-link">Products</a></li>
                <li><a href="#" class="nav-link">About</a></li>
                <li><a href="#" class="nav-link">Contact</a></li>
                <li><a href="#" class="nav-link">Shopping Cart</a></li>
                <li><a href="#" class="nav-link">Reviews</a></li>
            </ul>
        </nav>

        <!-- Иконки справа -->
        <div class="header-right">
            <button class="icon-btn" aria-label="Search">
                <img src="icons/search.svg" alt="">
            </button>
            <button class="icon-btn" aria-label="Shopping Cart">
                <img src="icons/cart_home.svg" alt="">
            </button>
            <button class="icon-btn" aria-label="Profile">
                <img src="icons/profile.svg" alt="">
            </button>
        </div>

    </div>
</header>


</body>
</html>
